<mat-card>
    <ul class="list-group" *ngIf="tododata.length > 0; else nodata">
        <li class="list-group-item d-flex justify-content-between " *ngFor="let todo of tododata; trackBy : trackbyfun">
            <strong>{{todo.todoItem}}</strong>
            <div>
                <button 
                (click)="onEditTodo(todo)"
                mat-mini-fab color="primary" class="mr-3"><mat-icon>edit</mat-icon></button>
                <button 
                (click)="onRemove(todo.todoId)"
                mat-mini-fab color="warn"><mat-icon>delete</mat-icon></button>
            </div>
        </li>
    </ul>
    <ng-template #nodata>
        <p class="alert alert-info">No data in added yet!!!</p>
    </ng-template>
</mat-card>
